[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# Aucune sqlalchemy.url ici : l'URL vient de app.core.config.get_settings()
# (voir migrations/env.py), pour ne jamais dupliquer un secret dans un
# fichier suivi par git. Les tests surchargent l'URL via
# `config.attributes["sqlalchemy_url"]`.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
