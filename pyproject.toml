[project]
name = "controle-bl-factures"
version = "0.1.0"
description = "Contrôle BL & factures fournisseurs (Habitat & Rénovation)"
requires-python = "==3.11.*"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"app/**/tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["app", "tests"]
addopts = "--import-mode=importlib"
markers = [
    "db: nécessite une base PostgreSQL de dev/test (jamais skip si injoignable)",
]
