[project]
name = "controle-bl-factures"
version = "0.1.0"
description = "Contrôle BL & factures fournisseurs (Habitat & Rénovation)"
requires-python = "==3.11.*"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.0.54",
    "uvicorn>=0.53.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
# S105 : les constantes "token"/"secret" des tests messaging/ingest sont des
# valeurs inventées (jamais de vrai secret), mais ressemblent à des mots de
# passe pour l'analyse statique. ASYNC240 : assertions sur `tmp_path`
# (`glob`/`iterdir`) dans des tests `anyio`, sans risque réel de blocage de
# boucle événementielle (aucun serveur, fichiers de test éphémères).
"tests/**" = ["S101", "S105", "ASYNC240"]
"app/**/tests/**" = ["S101", "S105", "ASYNC240"]

[tool.mypy]
strict = true
files = ["app", "tests"]

[[tool.mypy.overrides]]
# asyncpg ne fournit ni stubs ni marqueur py.typed ; utilisé uniquement pour
# distinguer ses erreurs de connexion dans `app.core.db.base_joignable`.
module = "asyncpg.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["app", "tests"]
addopts = "--import-mode=importlib"
pythonpath = ["."]
markers = [
    "db: nécessite une base PostgreSQL de dev/test (jamais skip si injoignable)",
]
filterwarnings = [
    # Un socket/transport non fermé dans un test (ex. serveur TCP jetable
    # mal nettoyé) ne doit jamais passer inaperçu : relevé en revue de T4,
    # tour 2, sur `port_connexion_pendante`. Vérifié que la suite complète
    # passe déjà sans ce genre de fuite (`-W error::ResourceWarning`, 3
    # exécutions consécutives, aucun flake).
    "error::ResourceWarning",
]
