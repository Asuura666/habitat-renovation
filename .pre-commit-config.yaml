repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format-check
        name: ruff format --check
        entry: uv run ruff format --check
        language: system
        pass_filenames: false
        always_run: true

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest
        entry: flock /tmp/habitat_reno-tests.lock uv run pytest
        language: system
        pass_filenames: false
        always_run: true

      - id: interdit-fixtures
        name: interdit tout fichier sous tests/fixtures/ (sauf README.md)
        entry: >-
          Fichier refusé : tests/fixtures/ ne doit contenir aucune fixture
          suivie par git (documents réels du client). Seul README.md y est autorisé.
        language: fail
        files: '^tests/fixtures/(?!README\.md$).*$'

      - id: interdit-env
        name: interdit tout fichier .env
        entry: >-
          Fichier refusé : un fichier .env (secrets) ne doit jamais être commité.
        language: fail
        files: '(^|/)\.env$'

      - id: front-typecheck
        name: web typecheck (tsc --noEmit)
        entry: npm --prefix web run typecheck
        language: system
        files: '^web/'
        pass_filenames: false

      - id: front-build
        name: web build (vite build)
        entry: flock /tmp/habitat_reno-tests.lock npm --prefix web run build
        language: system
        files: '^web/'
        pass_filenames: false

      - id: pip-audit
        name: pip-audit (dépendances Python)
        entry: >-
          sh -c 'uv export --frozen --no-dev --no-hashes | uvx pip-audit -r /dev/stdin'
        language: system
        files: '^(pyproject\.toml|uv\.lock)$'
        pass_filenames: false

      - id: npm-audit
        name: npm audit (dépendances front)
        entry: npm --prefix web audit --omit=dev --audit-level=high
        language: system
        files: '^web/package-lock\.json$'
        pass_filenames: false
