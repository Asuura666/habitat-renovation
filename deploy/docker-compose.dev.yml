# Surcouche de dev : publie postgres et api sur 127.0.0.1 pour un accès local
# sans Traefik (qui ne doit jamais démarrer sur cette machine, nginx occupant
# déjà les ports 80/443). Usage :
#   docker compose --env-file .env -f deploy/docker-compose.yml \
#     -f deploy/docker-compose.dev.yml up -d postgres

services:
  postgres:
    ports:
      - "127.0.0.1:5450:5432"
    # Base de dev/test jetable (migrée puis vidée par les tests) : la
    # durabilité en cas de panne n'a aucune valeur ici, alors que chaque
    # commit synchrone ralentit la suite de tests. Jamais sur habitat_prod
    # ni habitat_demo (surcouche docker-compose.vps.yml, pas celle-ci).
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]

  api:
    ports:
      - "127.0.0.1:8450:8000"
