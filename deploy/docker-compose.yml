name: habitat_reno

services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL manquant}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/letsencrypt

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Reconstruite vers l'hôte `postgres` du réseau compose : le `.env` du
      # dépôt n'est jamais copié dans l'image (voir Dockerfile), et sa
      # variable DATABASE_URL vise 127.0.0.1 côté hôte, pas le conteneur
      # (décision D18).
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER manquant}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB manquant}"
      DOCS_DIR: /srv/docs
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN manquant}"
      TELEGRAM_WEBHOOK_SECRET: "${TELEGRAM_WEBHOOK_SECRET:?TELEGRAM_WEBHOOK_SECRET manquant}"
      TELEGRAM_CHAT_BL_ID: "${TELEGRAM_CHAT_BL_ID:?TELEGRAM_CHAT_BL_ID manquant}"
      TELEGRAM_CHAT_SUPERVISION_ID: "${TELEGRAM_CHAT_SUPERVISION_ID:?TELEGRAM_CHAT_SUPERVISION_ID manquant}"
      MISTRAL_API_KEY: "${MISTRAL_API_KEY:?MISTRAL_API_KEY manquant}"
      # Optionnels : l'API reste disponible sans Drive ; seule la commande
      # `drive-sync` refuse alors de démarrer (L5-T11/Q1).
      GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: "${GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON:-}"
      GOOGLE_DRIVE_FOLDER_ID: "${GOOGLE_DRIVE_FOLDER_ID:-}"
      COOKIE_SECURE: "${COOKIE_SECURE:?COOKIE_SECURE manquant}"
      # Optionnelle, défaut false (décision d'Ilane du 24/09/2026,
      # docs/dette.md) : contrôles de prix R07/R08/R09 désactivés tant
      # qu'elle n'est pas explicitement à "true".
      CONTROLE_PRIX_ACTIF: "${CONTROLE_PRIX_ACTIF:-false}"
      # Optionnelle, défaut false (décision d'Ilane du 24/09/2026,
      # docs/dette.md) : R06 désactivée tant qu'elle n'est pas explicitement
      # à "true".
      CONTROLE_LIVRE_NON_FACTURE_ACTIF: "${CONTROLE_LIVRE_NON_FACTURE_ACTIF:-false}"
      # Optionnelle, défaut false (constat sécurité du 24/09/2026) : /docs,
      # /redoc et /openapi.json exposent le schéma complet de l'API sans
      # authentification, désactivés tant que cette variable n'est pas
      # explicitement à "true".
      API_DOCS_ACTIVES: "${API_DOCS_ACTIVES:-false}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${DOCS_HOST_DIR:?DOCS_HOST_DIR manquant}:/srv/docs
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${DOMAIN:?DOMAIN manquant}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
      # Point 4 (vague finale du lot 2) : en-têtes de sécurité HTTP, en
      # défense en profondeur en plus de l'application (voir
      # `app/core/origine.py` pour le contrôle d'origine). CSP compatible
      # avec le build Vite servi en même origine (`app/core/front.py`) :
      # aucun script/style externe, aucun script inline (vérifié sur le
      # build réel — `web/dist/index.html` ne référence que des fichiers
      # `/assets/*` hachés du même service, `style-src 'unsafe-inline'`
      # gardé par prudence, aucun style inline utilisé aujourd'hui).
      - "traefik.http.routers.api.middlewares=entetes-securite"
      - "traefik.http.middlewares.entetes-securite.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.entetes-securite.headers.frameDeny=true"
      - "traefik.http.middlewares.entetes-securite.headers.referrerPolicy=same-origin"
      - "traefik.http.middlewares.entetes-securite.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.entetes-securite.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.entetes-securite.headers.contentSecurityPolicy=default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'"
      - "traefik.http.middlewares.entetes-securite.headers.permissionsPolicy=camera=(), microphone=(), geolocation=(), payment=()"
      # COOP/CORP : mêmes en-têtes que deploy/nginx/habitat.conf, sans
      # équivalent nommé côté Traefik (customResponseHeaders générique).
      # `same-origin` pour les deux — photos de BL et PDF de factures sont
      # servis et consommés en même origine (voir habitat.conf).
      - "traefik.http.middlewares.entetes-securite.headers.customResponseHeaders.Cross-Origin-Opener-Policy=same-origin"
      - "traefik.http.middlewares.entetes-securite.headers.customResponseHeaders.Cross-Origin-Resource-Policy=same-origin"

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER manquant}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB manquant}"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER manquant} -d ${POSTGRES_DB:?POSTGRES_DB manquant}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  traefik-acme:
  postgres-data:
