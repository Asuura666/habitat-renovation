# Virtual hosts nginx du VPS partagé (surcouche deploy/docker-compose.vps.yml).
# Deux instances : production (habitat_prod, 127.0.0.1:8450) et démonstration
# à données fictives (habitat_demo, 127.0.0.1:8451).
#
# Installation :
#   sudo cp deploy/nginx/habitat.conf /etc/nginx/sites-available/habitat
#   sudo ln -s /etc/nginx/sites-available/habitat /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Certificat (un seul pour les deux noms, renouvelé par le timer certbot) :
#   sudo certbot certonly --nginx -d habitat.ellumena.fr \
#     -d demo.habitat.ellumena.fr --cert-name habitat.ellumena.fr
#
# Les en-têtes reprennent ceux des labels Traefik de deploy/docker-compose.yml
# (CSP stricte compatible avec le build Vite servi en même origine).

map $host $habitat_amont {
    habitat.ellumena.fr      127.0.0.1:8450;
    demo.habitat.ellumena.fr 127.0.0.1:8451;
}

server {
    listen 443 ssl http2;
    server_name habitat.ellumena.fr demo.habitat.ellumena.fr;

    ssl_certificate /etc/letsencrypt/live/habitat.ellumena.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/habitat.ellumena.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Limite applicative des documents : 20 Mio (marge pour l'enveloppe
    # multipart).
    client_max_body_size 25m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

    location / {
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://$habitat_amont;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    server_name habitat.ellumena.fr demo.habitat.ellumena.fr;
    return 301 https://$host$request_uri;
}
